# Builds the desktop installers and publishes them to a GitHub Release. Installed apps check
# these releases daily and update themselves.
#
# To release: set the same version in package.json, apps/desktop/package.json and
# packages/contracts/src/version.ts (a test checks they match), then push a tag "v<version>".
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Each installer is built on its own OS: Prisma's engines and PostgreSQL are native.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract tests (versions must match)
        run: pnpm --filter @pos/contracts test
      - name: Build the desktop app and stage the API, web app and PostgreSQL
        run: pnpm --filter @pos/desktop build && pnpm --filter @pos/desktop stage
      - name: Build installers and publish them to the release
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (see desktop-offline-online-plan.md, 3.7). Unsigned builds work but
          # Windows shows a SmartScreen warning and macOS blocks the app and its updates.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
