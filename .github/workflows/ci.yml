# Checks every push and pull request: types across the workspace, the shared contracts' unit
# tests, and the API's tests against a real PostgreSQL (see apps/api/test).
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma clients and build the shared packages
        run: |
          pnpm --filter @pos/api prisma:generate
          pnpm --filter @pos/types --filter @pos/contracts build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Contracts tests
        run: pnpm --filter @pos/contracts test
      - name: API tests
        run: pnpm --filter @pos/api test
      - name: Web app builds
        run: pnpm --filter @pos/web build
