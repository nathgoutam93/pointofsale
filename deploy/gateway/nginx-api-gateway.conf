# nginx: one API gateway for every product, https://api.example.com/v1/<product>/…
#
# Each product's service listens on its own local port; the gateway gives it a path and strips
# that path before passing the request on, so a service never needs to know its prefix (the POS
# API answers /v1/pos/meta as /meta). Adding a product is one upstream and one location, below.
#
# Needs the two snippets next to this file in /etc/nginx/snippets/ (README, "One API gateway for
# every product"). Replace api.example.com with the gateway's domain and example.com with the
# domain its web apps are on. Written for nginx 1.24 (Ubuntu 24.04); from 1.25.1, use
# "listen 443 ssl;" with "http2 on;" instead.

# WebSocket upgrades only when the client asks; otherwise an empty Connection header, so the
# connection to the service stays open for the next request (keepalive below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Web pages that the gateway's own CORS answers allow (snippets/gateway-cors.conf): https:// on
# example.com itself or any name under it. Anything else gets no CORS headers, so browsers refuse
# the answer.
map $http_origin $gateway_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*example\.com$" $http_origin;
}

# One upstream per product. keepalive reuses connections to the service.
upstream pos_api {
    server 127.0.0.1:3001;     # deploy/pos/pos-api.service
    keepalive 16;
}
upstream auth_api {
    server 127.0.0.1:8001;
    keepalive 16;
}
upstream inventory_api {
    server 127.0.0.1:8003;
    keepalive 16;
}
upstream checkout_api {
    server 127.0.0.1:8004;     # deploy/checkout/checkout-api.service
    keepalive 16;
}

# Plain HTTP: certificate renewals, and everything else to HTTPS. 308 keeps the method and body,
# so a POST stays a POST.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Products that need bigger requests raise this in their own location.
    client_max_body_size 10m;

    # Point of Sale (this repository). Desktop apps and the web app use
    # https://api.example.com/v1/pos as the server address.
    location /v1/pos/ {
        include snippets/gateway-proxy.conf;
        proxy_pass http://pos_api/;

        # The POS API answers CORS itself, from CORS_ORIGINS in its .env: no gateway CORS here,
        # or browsers see two Access-Control-Allow-Origin headers and refuse the answer.

        # Its sign-in cookie is set for Path=/. Keep it to this product, so it isn't sent to the
        # other services on this domain.
        proxy_cookie_path / /v1/pos/;

        # Business imports can be up to 2 GB; stream them instead of buffering them to disk, and
        # wait up to 10 minutes for them.
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Sign-in and accounts service.
    location /v1/auth/ {
        include snippets/gateway-proxy.conf;
        include snippets/gateway-cors.conf;
        proxy_pass http://auth_api/;
    }

    # Inventory service, with WebSockets kept open for up to a day.
    location /v1/inventory/ {
        include snippets/gateway-proxy.conf;
        include snippets/gateway-cors.conf;
        proxy_pass http://inventory_api/;
        proxy_read_timeout 86400s;
    }

    # Checkout: payments for every product, POS subscriptions included. The payment provider's
    # webhooks come here (e.g. /v1/checkout/webhooks/razorpay); nginx passes their bodies on
    # byte for byte, so the provider's signature still checks out.
    location /v1/checkout/ {
        include snippets/gateway-proxy.conf;
        include snippets/gateway-cors.conf;
        proxy_pass http://checkout_api/;
    }

    # A new product: an upstream above, then
    #   location /v1/<product>/ {
    #       include snippets/gateway-proxy.conf;
    #       include snippets/gateway-cors.conf;   # unless the service answers CORS itself
    #       proxy_pass http://<product>_api/;     # the trailing / strips /v1/<product>
    #   }

    # Any other path: a JSON 404, so a client sees the gateway answered but no product matched.
    location / {
        default_type application/json;
        return 404 '{"statusCode":404,"message":"No API at this path"}';
    }
}
