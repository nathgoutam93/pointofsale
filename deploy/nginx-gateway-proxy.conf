# /etc/nginx/snippets/gateway-proxy.conf: what every product behind the API gateway gets
# (deploy/nginx-api-gateway.conf). Included in each location, because a location that sets any
# proxy_set_header of its own drops all the ones it would have inherited.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The POS sign-in cookie is Secure when this says https.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# WebSockets, for a service that uses them.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
