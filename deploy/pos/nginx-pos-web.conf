# nginx for the web app in a browser, for online businesses. Replace app.example.com with the web
# app's domain and api.example.com with the API gateway's (deploy/gateway/nginx-api-gateway.conf; the POS
# API is under /v1/pos there). Keep both on the same site (e.g. app.example.com and
# api.example.com) so the sign-in cookie works, and list https://app.example.com in the API's
# CORS_ORIGINS. certbot --nginx then adds HTTPS
# (see "The web app in a browser" in apps/pos/README.md). deploy/pos/deploy.sh puts the build in the root.
server {
    listen 80;
    server_name app.example.com;

    root /var/www/pos-web;
    index index.html;

    # Built files have a hash in their names: they never change, so browsers keep them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Every other path is a screen of the app (/pos, /sales, …): the page itself, checked for a
    # new version on every load so a deploy reaches everyone. It may only talk to itself and the
    # API. (A location with its own add_header drops the server's, hence the headers here.)
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; connect-src 'self' https://api.example.com; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
