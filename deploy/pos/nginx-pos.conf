# nginx in front of the online server's API. Replace pos.example.com with the server's domain;
# certbot --nginx then adds HTTPS to it (see "Hosting the online server" in apps/pos/README.md).
server {
    listen 80;
    server_name pos.example.com;

    # Business imports can be up to 2 GB; stream them instead of buffering them to disk.
    client_max_body_size 2g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The sign-in cookie is Secure when this says https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
