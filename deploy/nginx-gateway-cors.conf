# /etc/nginx/snippets/gateway-cors.conf: CORS answered by the API gateway
# (deploy/nginx-api-gateway.conf), for a product whose service doesn't answer CORS itself.
# Included in that product's location. Not for the POS API: it answers CORS itself, and two
# Access-Control-Allow-Origin headers make browsers refuse the answer.

# The service's own CORS headers, if it sends any, are dropped so there is only one of each.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Max-Age;

# Empty for an origin the gateway doesn't allow, and nginx leaves an empty header out.
add_header Access-Control-Allow-Origin $gateway_cors_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Branch-ID" always;
add_header Access-Control-Max-Age 600 always;
# The answer depends on the Origin, so caches keep one per origin.
add_header Vary Origin always;

# Preflights are answered here, without reaching the service.
if ($request_method = OPTIONS) {
    return 204;
}
